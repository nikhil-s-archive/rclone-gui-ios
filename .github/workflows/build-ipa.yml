name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install gomobile toolchain
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init

      - name: Build RcloneKit.xcframework
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/build-rclone.sh

      - name: Verify RcloneKit was generated
        run: |
          ls -ld Frameworks/RcloneKit.xcframework

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Archive
        run: |
          xcodebuild -resolvePackageDependencies -scheme "Rclone GUI"
          xcodebuild -scheme "Rclone GUI" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive -archivePath build/Rclone.xcarchive

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r "build/Rclone.xcarchive/Products/Applications/"*.app Payload/
          find Payload -name "*.app" -exec codesign --force --deep --sign - {} + || true
          zip -r -y "Rclone-GUI.ipa" Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rclone-GUI-IPA
          path: Rclone-GUI.ipa
